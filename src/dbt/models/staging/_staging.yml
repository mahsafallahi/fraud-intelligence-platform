version: 2

# Primary-key tests on the staging views, plus: every transaction category has a
# row in the MCC seed (and, in seeds.yml, every seed mcc exists in stg_mcc_codes).
models:
  - name: stg_transactions
    description: Silver transactions, select only.
    columns:
      - name: trans_num
        data_tests:
          - unique
          - not_null
      - name: category
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('category_mcc_map')
                field: category

  - name: stg_census_acs
    description: Silver Census ACS, select only.
    data_tests:
      - unique:
          arguments:
            column_name: "zip || '|' || _vintage"
    columns:
      - name: zip
        data_tests:
          - not_null

  - name: stg_census_zcta
    description: Silver Census Gazetteer, select only.
    data_tests:
      - unique:
          arguments:
            column_name: "zip || '|' || _vintage"
    columns:
      - name: zip
        data_tests:
          - not_null

  - name: stg_mcc_codes
    description: Silver MCC reference, select only (code and description).
    columns:
      - name: mcc
        data_tests:
          - unique
          - not_null
      - name: description
        data_tests:
          - not_null

  - name: stg_holidays
    description: Silver holidays, select only. Key is (holiday_date, name, state_code).
    data_tests:
      - unique:
          arguments:
            column_name: "holiday_date || '|' || name || '|' || coalesce(state_code, 'nationwide')"
    columns:
      - name: holiday_date
        data_tests:
          - not_null
